apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Hackers API CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write

jobs:
  ci:
    outputs:
      CODE_COVERAGE: ${{ steps.test_metrics.outputs.CODE_COVERAGE }}

    steps:
      - name: Get source code
        uses: cloudbees-io/checkout@v1

      - name: Generate Swagger documentation
        uses: docker://golang:1.23
        shell: bash
        run: |
          set -e

          go install github.com/swaggo/swag/cmd/swag@latest
          swag init

      - name: Validate source formatting
        uses: docker://golang:1.23
        shell: bash
        run: |
          set -e

          UNFORMATTED_FILES="$(
            find . \
              -name '*.go' \
              -not -path './vendor/*' \
              -print0 |
            xargs -0 gofmt -l
          )"

          if [ -n "$UNFORMATTED_FILES" ]; then
            echo "The following files require gofmt:"
            echo "$UNFORMATTED_FILES"
            exit 1
          fi

          echo "All Go source files are correctly formatted."

      - name: Run static code checks
        uses: docker://golang:1.23
        shell: bash
        run: |
          set -e
          go vet ./...

      - name: Compile application
        id: compile_application
        kind: build
        uses: docker://golang:1.23
        shell: bash
        run: |
          mkdir -p dist

          if go build -o dist/hackers-api .; then
            BUILD_STATUS="Passed"
            echo "Application compiled successfully."
            ls -lh dist/hackers-api
          else
            BUILD_STATUS="Failed"
          fi

          echo "$BUILD_STATUS" \
            > "$CLOUDBEES_OUTPUTS/BUILD_STATUS"

          if [ "$BUILD_STATUS" = "Failed" ]; then
            exit 1
          fi

      - name: Run unit tests
        id: unit_tests
        kind: test
        continue-on-error: true
        uses: docker://golang:1.23
        shell: bash
        run: |
          set -o pipefail

          export PATH="${PATH}:${GOPATH}/bin"
          REPORT_DIR="${{ cloudbees.workspace }}/test-reports"

          mkdir -p "$REPORT_DIR"

          if ! go install github.com/jstemmer/go-junit-report@latest; then
            echo "Failed" \
              > "$CLOUDBEES_OUTPUTS/TEST_STATUS"
            exit 1
          fi

          TEST_EXIT=0

          go test \
            -coverprofile=coverage.out \
            -v ./... 2>&1 \
            | tee "$REPORT_DIR/go-test.log" \
            | go-junit-report -set-exit-code \
              > "$REPORT_DIR/junit.xml" || TEST_EXIT=$?

          if [ "$TEST_EXIT" -eq 0 ]; then
            TEST_STATUS="Passed"
          else
            TEST_STATUS="Failed"
          fi

          echo "$TEST_STATUS" \
            > "$CLOUDBEES_OUTPUTS/TEST_STATUS"

          exit "$TEST_EXIT"

      - name: Publish test results to Unify
        if: ${{ always() && steps.unit_tests.outputs.TEST_STATUS != '' }}
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: go
          results-path: ${{ cloudbees.workspace }}/test-reports/junit.xml

      - name: Calculate code coverage
        id: test_metrics
        if: ${{ always() }}
        uses: docker://golang:1.23
        shell: bash
        run: |
          if [ -f coverage.out ]; then
            COVERAGE="$(
              go tool cover -func=coverage.out |
              awk '/^total:/ {print $3}'
            )"
          else
            COVERAGE="Unavailable"
          fi

          echo "Code coverage: $COVERAGE"

          echo "$COVERAGE" \
            > "$CLOUDBEES_OUTPUTS/CODE_COVERAGE"

      - name: Publish build and test evidence
        if: ${{ always() }}
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Build and Test Summary

            | Control | Result |
            |---|---|
            | Application compilation | ${{ steps.compile_application.outputs.BUILD_STATUS }} |
            | Unit tests | ${{ steps.unit_tests.outputs.TEST_STATUS }} |
            | Code coverage | ${{ steps.test_metrics.outputs.CODE_COVERAGE }} |
            | Test framework | Go |
            | Commit | `${{ cloudbees.scm.sha }}` |
            | Branch | `${{ cloudbees.scm.ref }}` |
            | Workflow run | `${{ cloudbees.run_id }}` |

            Detailed test suites, test cases, execution times, and failures are
            available in the **Test results** view for this workflow run.
          format: MARKDOWN

      - name: Enforce unit test result
        if: ${{ steps.unit_tests.outputs.TEST_STATUS == 'Failed' }}
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "Unit tests failed. Container publication is blocked."
          exit 1

  security:
    steps:
      - name: Get source code
        uses: cloudbees-io/checkout@v1

      - name: Scan Go source with Gosec
        id: gosec
        continue-on-error: true
        uses: cloudbees-io/gosec-plugin@v1

      - name: Publish security evidence
        if: ${{ always() }}
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Source Security Summary

            | Severity | Findings |
            |---|---:|
            | Critical | ${{ steps.gosec.outputs.critical-count }} |
            | Very high | ${{ steps.gosec.outputs.very-high-count }} |
            | High | ${{ steps.gosec.outputs.high-count }} |
            | Medium | ${{ steps.gosec.outputs.medium-count }} |
            | Low | ${{ steps.gosec.outputs.low-count }} |

            **Scan context**

            - Scanner: Gosec
            - Commit: `${{ cloudbees.scm.sha }}`
            - Branch: `${{ cloudbees.scm.ref }}`
            - Workflow run: `${{ cloudbees.run_id }}`
          format: MARKDOWN

  container_build_publish:
    needs:
      - ci
      - security
    uses: shozab-unify-examples/sn-hackers-workflows/container-build.yaml
    vars: inherit
    secrets: inherit
    with:
      appName: hackers-api
      versionStart: "3.0"
      repo: shozab-unify-examples/sn-hackers-api