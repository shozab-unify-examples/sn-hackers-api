apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: vault-secret-demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on:
      - native,my-label-3        # replace with your Edge Runner label
    steps:
      - name: Log in to Vault (AppRole) and read secret
        id: vault
        shell: sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          ROLE_ID: ${{ vars.VAULT_ROLE_ID }}
          SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          command -v vault >/dev/null || { echo "vault CLI not found on runner host"; exit 1; }
          CLIENT_TOKEN=$(vault write -field=token auth/approle/login role_id="$ROLE_ID" secret_id="$SECRET_ID")
          export VAULT_TOKEN="$CLIENT_TOKEN"
          PASSWORD=$(vault kv get -field=password secret/demo)
          echo -n "$PASSWORD" > "$CLOUDBEES_OUTPUTS/password"

      - name: Use the secret later in the workflow
        shell: sh
        env:
          DB_PASSWORD: ${{ steps.vault.outputs.password }}
        run: |
          echo "Retrieved a secret from Vault and used it downstream - length: ${#DB_PASSWORD} characters"
          # A real pipeline would pass DB_PASSWORD to whatever needs it here.
          # Never print the value itself.